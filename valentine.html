<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Em 💖 My Valentine?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:Georgia, serif;
}

/* SWIRLY ROMANTIC BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:
    radial-gradient(circle at 25% 30%, #ff9ad5, transparent 60%),
    radial-gradient(circle at 70% 35%, #d4af37, transparent 65%),
    radial-gradient(circle at 45% 75%, #9caf88, transparent 60%),
    radial-gradient(circle at 80% 80%, #ffd6f1, transparent 65%);
  filter:blur(100px);
  animation:swirl 28s linear infinite;
  z-index:-2;
}

@keyframes swirl{to{transform:rotate(360deg);}}

/* CONTENT */
canvas{position:fixed;top:0;left:0;}

.content{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
}

.card{
  background:rgba(255,192,203,.18);
  backdrop-filter:blur(20px);
  padding:3.5rem;
  border-radius:35px;
  max-width:760px;
  border:2px solid rgba(212,175,55,.6);
  box-shadow:0 30px 90px rgba(0,0,0,.45);
}

h1{
  font-size:3.2rem;
  margin-bottom:1rem;
}

.name{
  font-size:4.5rem;
  font-weight:bold;
  background:linear-gradient(90deg,#fff3b0,#d4af37,#fff3b0);
  background-size:200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gold 4s linear infinite;
  margin-bottom:1.5rem;
}

@keyframes gold{to{background-position:200% center;}}

#question{
  font-size:1.5rem;
  line-height:2;
  margin-top:1.5rem;
}

.buttons{
  margin-top:2.5rem;
}

button{
  padding:1rem 2.5rem;
  margin:0 .8rem;
  border:none;
  border-radius:30px;
  font-size:1.2rem;
  cursor:pointer;
  transition:.3s;
}

.yes{
  background:#ff1493;
  color:white;
  box-shadow:0 10px 30px rgba(255,20,147,.6);
}

.no{
  background:rgba(255,255,255,.2);
  color:white;
}

.yes:hover{transform:scale(1.1);}
.no:hover{transform:translateX(20px);}

</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/10/03/audio_4aef35c2b6.mp3">
</audio>

<div class="content">
<div class="card">

<h1>Hey Em 💖</h1>
<div class="name">Will You</div>

<div id="question">
Be my Valentine? 💌<br>
Every day with you feels like love,<br>
but I’d really love to call this one ours.
</div>

<div class="buttons">
<button class="yes" onclick="yes()">YES 💖</button>
<button class="no" onclick="no()">NO 🙈</button>
</div>

</div>
</div>

<script>
/* BUTTON BEHAVIOR */
function yes(){
  alert("Best answer ever 💘");
}

function no(){
  alert("Incorrect answer 😤💖");
}

/* THREE.JS HEARTS */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=12;

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,.9));
const pink=new THREE.PointLight(0xff69b4,2);
pink.position.set(5,5,5);
scene.add(pink);

const hearts=[];
function heart(){
  const s=new THREE.Shape();
  s.moveTo(0,0);
  s.bezierCurveTo(0,0,-1,-1.5,-2,0);
  s.bezierCurveTo(-3.5,2.5,0,4.5,0,6);
  s.bezierCurveTo(0,4.5,3.5,2.5,2,0);
  s.bezierCurveTo(1,-1.5,0,0,0,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:.6,bevelEnabled:true});
  const m=new THREE.MeshStandardMaterial({
    color:0xff1493,
    metalness:.8,
    roughness:.2,
    emissive:0xff69b4,
    emissiveIntensity:.6
  });
  const h=new THREE.Mesh(g,m);
  h.scale.set(.3,.3,.3);
  h.position.set((Math.random()-.5)*20,(Math.random()-.5)*20,(Math.random()-.5)*20);
  h.userData.o=Math.random()*Math.PI*2;
  scene.add(h);
  hearts.push(h);
}
for(let i=0;i<30;i++)heart();

onclick=()=>{
  if(navigator.vibrate) navigator.vibrate([40,80,40]);
  for(let i=0;i<4;i++)heart();
};

function animate(){
  requestAnimationFrame(animate);
  const t=Date.now()*0.003;
  hearts.forEach(h=>{
    const p=1+Math.sin(t+h.userData.o)*.08;
    h.scale.set(.3*p,.3*p,.3*p);
    h.rotation.y+=.003;
    h.rotation.x+=.002;
  });
  renderer.render(scene,camera);
}
animate();

onresize=()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};
</script>

</body>
</html>
